[project]
name = "django-sqlite-backup"
version = "0.3.0"
description = "A Django app to easily backup your sqlite database through an endpoint."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ferran Jovell", email = "ferran.jovell+gh@gmail.com" },
]
keywords = [
    "django",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Environment :: Web Environment",
    "Framework :: Django",
]
dependencies = [
    "Django",
    "asgiref",
]

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://github.com/mrswats/django-sqlite-backup"
"Bug Tracker" = "https://github.com/mrswats/django-sqlite-backup/issues"

[project.optional-dependencies]
aws = [
    "boto3",
]
test = [
    "boto3",
    "coverage",
    "moto",
    "pytest",
    "pytest-django",
    "time-machine",
]

[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "django_sqlite_backup",
    "django_sqlite_backup.management",
    "django_sqlite_backup.management.commands",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "testing.settings"

[tool.black]
line-length = 99
target_version = [
    "py39",
]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = "(\n  /(\n      \\.eggs         # exclude a few common directories in the\n    | \\.git          # root of the project\n    | \\.hg\n    | \\.mypy_cache\n    | \\.tox\n    | \\.venv\n    | _build\n    | buck-out\n    | build\n    | dist\n  )/\n)\n"

[tool.coverage.run]
source = [
    "django_sqlite_backup",
]
branch = true

[tool.coverage.report]
skip_empty = false
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
